name: Release - Automated Deployment

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags (v1.0.0, v1.2.3, etc.)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog for this version
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' || echo "See CHANGELOG.md for details")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create source archive
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          tar -czf /tmp/avar-v${VERSION}-source.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='*.tar.gz' \
            .
          mv /tmp/avar-v${VERSION}-source.tar.gz .

      - name: Create documentation archive
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          tar -czf avar-v${VERSION}-docs.tar.gz docs/ README.md CHANGELOG.md || true

      - name: Create Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: A.V.A.R. v${{ steps.get_version.outputs.version }}
          body: |
            ## A.V.A.R. - Aura Verification and Authentication for RAW files

            **Version**: ${{ steps.get_version.outputs.version }}

            ### Changes in this Release

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            ```bash
            # Clone the repository
            git clone https://github.com/${{ github.repository }}.git
            cd AI-Photo-Detection-Innovation
            git checkout v${{ steps.get_version.outputs.version }}

            # Run quick start
            ./quickstart.sh
            ```

            ### Documentation

            - [Installation Guide](docs/guides/TESTING_GUIDE.md)
            - [Developer Documentation](docs/guides/CLAUDE.md)
            - [API Documentation](http://localhost:8001/docs)

            ---

            **Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            avar-v${{ steps.get_version.outputs.version }}-source.tar.gz
            avar-v${{ steps.get_version.outputs.version }}-docs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Build and Push Docker Images
  # ============================================================================
  build-and-push-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: ai-detection
            context: ./src/backend/ai-detection-service
          - name: api-gateway
            context: ./src/backend/api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ============================================================================
  # Notification
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [create-release, build-and-push-images]
    if: always()

    steps:
      - name: Send success notification
        if: needs.build-and-push-images.result == 'success'
        run: |
          echo "✅ Release v${{ needs.create-release.outputs.version }} published successfully!"

      - name: Send failure notification
        if: needs.build-and-push-images.result == 'failure'
        run: |
          echo "❌ Release v${{ needs.create-release.outputs.version }} failed!"

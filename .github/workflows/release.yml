name: Release - Automated Deployment

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOCKERHUB_USERNAME: rasandilikshana

jobs:
  # ============================================================================
  # Create GitHub Release
  # ============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANGELOG=$(awk "/## \[$VERSION\]/,/## \[/" CHANGELOG.md | sed '$d' || echo "See CHANGELOG.md for details")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create source archive
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          tar -czf /tmp/avar-v${VERSION}-source.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='*.tar.gz' \
            .
          mv /tmp/avar-v${VERSION}-source.tar.gz .

      - name: Create documentation archive
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          tar -czf avar-v${VERSION}-docs.tar.gz docs/ README.md CHANGELOG.md || true

      - name: Create Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: A.V.A.R. v${{ steps.get_version.outputs.version }}
          body: |
            ## A.V.A.R. - Aura Verification and Authentication for RAW files

            **Version**: ${{ steps.get_version.outputs.version }}

            ### Docker Images

            ```bash
            docker pull rasandilikshana/avar-ai-detection:${{ steps.get_version.outputs.version }}
            docker pull rasandilikshana/avar-competition:${{ steps.get_version.outputs.version }}
            ```

            ### Changes in this Release

            ${{ steps.changelog.outputs.changelog }}

            ### Live Demo

            - **Production**: https://avar.studio
            - **API Docs**: https://avar.studio/api/v1/docs

            ### Installation

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd AI-Photo-Detection-Innovation
            git checkout v${{ steps.get_version.outputs.version }}
            ./quickstart.sh
            ```

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            avar-v${{ steps.get_version.outputs.version }}-source.tar.gz
            avar-v${{ steps.get_version.outputs.version }}-docs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram - Release Started
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.get_version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          MESSAGE="🚀 <b>A.V.A.R. Release v${VERSION}</b>%0A%0A📦 GitHub Release created!%0A🔗 <a href='https://github.com/${REPO}/releases/tag/v${VERSION}'>View Release</a>%0A%0A⏳ Building Docker images..."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"

  # ============================================================================
  # Build and Push Docker Images to Docker Hub
  # ============================================================================
  build-and-push-images:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: avar-ai-detection
            context: ./src/backend/ai-detection-service
            dockerfile: ./src/backend/ai-detection-service/Dockerfile
          - name: avar-competition
            context: ./src/backend/competition-service
            dockerfile: ./src/backend/competition-service/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.create-release.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ============================================================================
  # Send Telegram Notification
  # ============================================================================
  notify-telegram:
    name: Send Telegram Notification
    runs-on: ubuntu-latest
    needs: [create-release, build-and-push-images]
    if: always()

    steps:
      - name: Send Success Notification
        if: needs.build-and-push-images.result == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          MESSAGE="✅ <b>A.V.A.R. v${VERSION} Released!</b>%0A%0A🐳 <b>Docker Images:</b>%0A• <code>rasandilikshana/avar-ai-detection:${VERSION}</code>%0A• <code>rasandilikshana/avar-competition:${VERSION}</code>%0A%0A📦 <b>Artifacts:</b>%0A• Source: avar-v${VERSION}-source.tar.gz%0A• Docs: avar-v${VERSION}-docs.tar.gz%0A%0A🔗 <b>Links:</b>%0A• <a href='https://github.com/${REPO}/releases/tag/v${VERSION}'>GitHub Release</a>%0A• <a href='https://hub.docker.com/u/rasandilikshana'>Docker Hub</a>%0A• <a href='https://avar.studio'>Live Demo</a>%0A%0A🎉 Deployment successful!"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"

      - name: Send Failure Notification
        if: needs.build-and-push-images.result == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MESSAGE="❌ <b>A.V.A.R. v${VERSION} Build Failed!</b>%0A%0A⚠️ Docker image build failed.%0A%0A🔗 <a href='https://github.com/${REPO}/actions/runs/${RUN_ID}'>View Workflow Logs</a>%0A%0APlease check the logs and fix the issue."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"

      - name: Send Skipped Notification
        if: needs.build-and-push-images.result == 'skipped'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ needs.create-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          MESSAGE="⏭️ <b>A.V.A.R. v${VERSION}</b>%0A%0ADocker build was skipped.%0A%0A🔗 <a href='https://github.com/${REPO}/releases/tag/v${VERSION}'>GitHub Release</a>"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"

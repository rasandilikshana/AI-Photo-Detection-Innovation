[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
    --color=yes

# Markers
markers =
    e2e: End-to-end browser tests
    integration: Integration tests
    slow: Slow-running tests (> 10 seconds)
    performance: Performance and load tests
    unit: Unit tests
    smoke: Smoke tests (quick validation)

# Timeout
timeout = 300

# Coverage
[coverage:run]
source = src/backend/ai-detection-service/app
omit =
    */tests/*
    */conftest.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

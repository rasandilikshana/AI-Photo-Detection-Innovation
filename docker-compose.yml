version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: avar-postgres
    environment:
      POSTGRES_DB: avar_db
      POSTGRES_USER: avar_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - avar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avar_user -d avar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: avar-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - avar-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Detection Service (Python)
  ai-detection-service:
    build:
      context: ./src/backend/ai-detection-service
      dockerfile: Dockerfile
    container_name: avar-ai-detection
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://avar_user:${DB_PASSWORD:-change_me_in_production}@postgres:5432/avar_db
      - SERVICE_PORT=8001
      - LOG_LEVEL=INFO
    ports:
      - "8001:8001"
    volumes:
      - ./src/backend/ai-detection-service:/app
      - upload_storage:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - avar-network
    restart: unless-stopped

  # Competition Management Service (Python FastAPI)
  competition-service:
    build:
      context: ./src/backend/competition-service
      dockerfile: Dockerfile
    container_name: avar-competition
    environment:
      - DATABASE_URL=postgresql+asyncpg://avar_user:${DB_PASSWORD:-change_me_in_production}@postgres:5432/avar_competitions
      - REDIS_URL=redis://redis:6379/1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development-secret-key-change-in-production}
      - AI_DETECTION_SERVICE_URL=http://ai-detection-service:8001
      - API_GATEWAY_URL=http://api-gateway:8000
      - SERVICE_PORT=8080
      - SERVICE_HOST=0.0.0.0
      - ENVIRONMENT=production
      - DEBUG=False
      - LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    volumes:
      - ./src/backend/competition-service:/app
      - competition_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-detection-service:
        condition: service_started
    networks:
      - avar-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # API Gateway (Node.js/Python FastAPI)
  api-gateway:
    build:
      context: ./src/backend/api-gateway
      dockerfile: Dockerfile
    container_name: avar-gateway
    environment:
      - AI_DETECTION_URL=http://ai-detection-service:8001
      - COMPETITION_SERVICE_URL=http://competition-service:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      - ai-detection-service
      - competition-service
    networks:
      - avar-network
    restart: unless-stopped

  # Frontend Application (Vue.js)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: avar-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - api-gateway
    networks:
      - avar-network
    restart: unless-stopped

networks:
  avar-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  upload_storage:
  competition_uploads:
